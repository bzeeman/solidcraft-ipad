# The iPad spike (apps/solidcraft-ios): build SolidCraft for the iOS simulator on a GitHub Mac,
# start it in an iPad simulator and keep pictures of its screen, its log and the app bundle.
#
# Runs on pushes to the spike's branch only, and by hand. The bundle (SolidCraft-ios-sim) runs in
# the Simulator of any Apple silicon Mac with Xcode: unzip it and drag SolidCraft.app onto a
# running iPad simulator, or `xcrun simctl install booted SolidCraft.app`.
#
# The pictures and the log also go to the ios-sim-results branch (one commit, replaced by each
# run), where git alone can fetch them.
name: iPad simulator

on:
  push:
    branches: [ios-sim-spike]
  workflow_dispatch:

permissions:
  # Pushes the ios-sim-results branch.
  contents: write

concurrency:
  group: ios-sim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Build and launch in an iPad simulator
    runs-on: macos-15
    timeout-minutes: 120
    env:
      # Quick to build, quick enough to run (the profile the tests use).
      PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Our own crates are most of the build, and cargo rebuilds them all after a checkout (their
      # sources are newer than the cached build). sccache answers every unchanged crate from
      # GitHub's cache instead; rust-cache below keeps the dependencies.
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ios-sim-${{ env.PROFILE }}
          # A spike iterates on a broken build: keep what compiled.
          cache-on-failure: true
      - name: Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -i ipad || true
      - name: Build and bundle
        env:
          # On this step only: rust-cache's key takes in every RUST* variable of the job.
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          # Without the cache service, compile as usual.
          SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
        run: |
          packaging/ios/bundle-sim.sh --profile "$PROFILE"
          sccache --show-stats || true
      - name: Launch in an iPad simulator
        id: launch
        run: packaging/ios/run-sim.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-sim-run
          path: dist/ios-sim/run/
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: SolidCraft-ios-sim
          path: dist/ios-sim/SolidCraft-ios-sim.zip
          if-no-files-found: warn
      - name: Publish the run to the ios-sim-results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(ls -A dist/ios-sim/run 2> /dev/null)" ]; then
            echo "nothing to publish"
            exit 0
          fi
          work="$(mktemp -d)"
          cp -R dist/ios-sim/run/. "$work/"
          cd "$work"
          git init -q -b ios-sim-results
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "iPad simulator run $GITHUB_RUN_ID of $GITHUB_SHA"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ios-sim-results
