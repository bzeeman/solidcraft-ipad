# The iPad spike (apps/solidcraft-ios), on GitHub Macs. Three jobs:
#
# - simulator: build SolidCraft for the iOS simulator, start it in an iPad simulator (once with
#   an Apple Pencil's squeeze, once with fingers moving the view, both the app's own) and keep
#   pictures of its screen, its log and the app bundle. The bundle (SolidCraft-ios-sim) runs in
#   the Simulator of any Apple silicon Mac with Xcode: unzip it and drag SolidCraft.app onto a
#   running iPad simulator, or `xcrun simctl install booted SolidCraft.app`. The pictures and the
#   log also go to the ios-sim-results branch (one commit, replaced by each run), where git alone
#   can fetch them.
# - device: build the same app for a real iPad (SolidCraft-ios-device). That bundle is NOT signed,
#   and an iPad installs it only once it is.
# - testflight: sign that bundle and upload it to TestFlight (packaging/ios/testflight.sh), which
#   is how it reaches an iPad with no Mac of one's own. It takes an App Store Connect API key in
#   the repository's secrets ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8; without them it is a dry
#   run that makes the same package and calls nobody. The key reaches only the steps that run
#   that script, in a job with nothing else but GitHub's own actions, each pinned.
#
# Runs on pushes to the spike's branches only, and by hand.
name: iPad spike

on:
  push:
    branches: [ios-sim-spike, ipad-pencil-spike]
  workflow_dispatch:

permissions:
  # Pushes the ios-sim-results branch.
  contents: write

concurrency:
  group: ios-sim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Build and launch in an iPad simulator
    runs-on: macos-15
    timeout-minutes: 120
    env:
      # Quick to build, quick enough to run (the profile the tests use).
      PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Our own crates are most of the build, and cargo rebuilds them all after a checkout (their
      # sources are newer than the cached build). sccache answers every unchanged crate from
      # GitHub's cache instead; rust-cache below keeps the dependencies.
      - name: Set up compiler cache
        id: sccache
        # A cache, not a need: when it cannot be set up (GitHub once answered its download with
        # HTTP 500, three times over) the job goes on and compiles everything.
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ios-sim-${{ env.PROFILE }}
          # A spike iterates on a broken build: keep what compiled.
          cache-on-failure: true
      - name: Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -i ipad || true
      - name: Build and bundle
        env:
          # On this step only: rust-cache's key takes in every RUST* variable of the job. Empty
          # (no wrapper) when the compiler cache could not be set up.
          RUSTC_WRAPPER: ${{ steps.sccache.outcome == 'success' && 'sccache' || '' }}
          SCCACHE_GHA_ENABLED: "true"
          # Without the cache service, compile as usual.
          SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
        run: |
          packaging/ios/bundle.sh --profile "$PROFILE"
          sccache --show-stats || true
      - name: Launch in an iPad simulator
        id: launch
        env:
          # The simulator has no Apple Pencil: the app squeezes one for itself and holds on, so
          # the pictures show the ring of keys (apps/solidcraft-ios/src/main.rs, `DEMO`).
          SIMCTL_CHILD_SOLIDCRAFT_IOS_PENCIL_DEMO: ring
        run: packaging/ios/run-sim.sh
      - name: Move the view with fingers in the simulator
        env:
          # A simulator on a build machine has no fingers either: the app puts its own on the
          # model (a tap, two carrying it, two spreading, one dragging) and says in its log what
          # the selection and the camera did (apps/solidcraft-ios/src/main.rs, `TOUCH_DEMO`).
          SIMCTL_CHILD_SOLIDCRAFT_IOS_TOUCH_DEMO: camera
          OUT: dist/ios-sim/run/touch
          SIM_SHOTS: "10 25"
        run: |
          packaging/ios/run-sim.sh
          grep -F "touch" dist/ios-sim/run/touch/stderr.log || true
          grep -qF "touch demo: the camera moved as expected" dist/ios-sim/run/touch/stderr.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-sim-run
          path: dist/ios-sim/run/
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: SolidCraft-ios-sim
          path: dist/ios-sim/SolidCraft-ios-sim.zip
          if-no-files-found: warn
      - name: Publish the run to the ios-sim-results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(ls -A dist/ios-sim/run 2> /dev/null)" ]; then
            echo "nothing to publish"
            exit 0
          fi
          work="$(mktemp -d)"
          cp -R dist/ios-sim/run/. "$work/"
          cd "$work"
          git init -q -b ios-sim-results
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "iPad simulator run $GITHUB_RUN_ID of $GITHUB_SHA"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ios-sim-results

  device:
    name: Build for a real iPad (not signed)
    runs-on: macos-15
    timeout-minutes: 120
    env:
      PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up compiler cache
        id: sccache
        # As in the simulator job.
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ios-device-${{ env.PROFILE }}
          cache-on-failure: true
      - name: Use Xcode 26
        # Apple takes uploads built with Xcode 26 or later. Not 27: UIKit starts an app built
        # with that SDK only if it has a scene life cycle, and the window layer (winit 0.30) has
        # none.
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | grep -v -i -E 'beta|candidate' | sort -V | tail -1 || true)"
          if [ -z "$xcode" ]; then
            echo "::error::this runner has no Xcode 26: $(find /Applications -maxdepth 1 -name 'Xcode*' | tr '\n' ' ')"
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$xcode/Contents/Developer" xcodebuild -version
      - name: Build and bundle
        env:
          # As in the simulator job.
          RUSTC_WRAPPER: ${{ steps.sccache.outcome == 'success' && 'sccache' || '' }}
          SCCACHE_GHA_ENABLED: "true"
          SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          packaging/ios/bundle.sh --device --profile "$PROFILE"
          sccache --show-stats || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SolidCraft-ios-device
          path: dist/ios-device/SolidCraft-ios-device.zip
          if-no-files-found: error

  testflight:
    name: Sign and upload to TestFlight (a dry run without the API key)
    needs: device
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    # One at a time, whatever the branch: a run removes what another of its kind made at Apple.
    concurrency:
      group: ios-testflight
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Xcode 26
        # Apple takes uploads built with Xcode 26 or later. Not 27: UIKit starts an app built
        # with that SDK only if it has a scene life cycle, and the window layer (winit 0.30) has
        # none.
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | grep -v -i -E 'beta|candidate' | sort -V | tail -1 || true)"
          if [ -z "$xcode" ]; then
            echo "::error::this runner has no Xcode 26: $(find /Applications -maxdepth 1 -name 'Xcode*' | tr '\n' ' ')"
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$xcode/Contents/Developer" xcodebuild -version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SolidCraft-ios-device
          path: dist/ios-device
      - name: Sign, upload and wait for Apple
        env:
          # The key reaches the two steps that run the script, and nothing else in the job.
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          # A number Apple has not seen for this version, also when only this job runs again.
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          ditto -x -k dist/ios-device/SolidCraft-ios-device.zip dist/ios-device
          packaging/ios/testflight.sh
      - name: Leave nothing of an interrupted run at Apple
        # The script does this itself when it ends; this is for when it was cut off.
        if: ${{ failure() || cancelled() }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: packaging/ios/testflight.sh --cleanup
