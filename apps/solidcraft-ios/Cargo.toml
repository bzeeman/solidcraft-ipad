[package]
name = "solidcraft-ios"
description = "SolidCraft on iPadOS (a spike): the shared app in eframe's native runner, on UIKit and Metal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The workspace lints, except unsafe_code: denied, not forbidden, so that src/documents.rs (the
# system's document picker, security-scoped files, bookmarks) can allow it where objc2 has no safe
# API. Keep the rest in sync with [workspace.lints].
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
# `!(x > tol)` is our idiom for "not a usable number" (NaN-safe).
neg_cmp_op_on_partial_ord = "allow"

[[bin]]
name = "solidcraft-ios"
path = "src/main.rs"

[features]
default = ["bundled-render-library", "profile"]
bundled-render-library = ["solidcraft-engine/bundled-render-library"]
# The profiler, compiled in as in the other apps; it records nothing until asked.
profile = ["solidcraft-engine/profile"]

[dependencies]
solidcraft-engine = { workspace = true }
solidcraft-ui-egui = { workspace = true }
solidcraft-theme = { workspace = true }
solidcraft-viewport = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Only an iOS target builds the app; elsewhere the binary says so (as solidcraft-web does off wasm),
# so the workspace still builds everywhere.
[target.'cfg(target_os = "ios")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSError", "NSString", "NSURL"] }
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-uniform-type-identifiers", "UIApplication", "UIDocumentPickerViewController", "UIResponder", "UIView", "UIViewController", "UIWindow"] }
# The vendored winit (patched in the workspace), for the files the system hands the app.
winit = { version = "0.30", default-features = false }
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTType"] }
# The agent chat: SolidCraft's MCP server in the app's own process (iPadOS starts no helper), and
# HTTP for its endpoint agents, as the desktop app sends it (rustls, the system's certificates).
solidcraft-mcp = { workspace = true }
solidcraft-control = { workspace = true }
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
