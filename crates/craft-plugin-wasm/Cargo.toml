[package]
name = "craft-plugin-wasm"
description = "App-independent WebAssembly component runtime for Craft plugins"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
craft-plugin = { path = "../craft-plugin" }
serde_json = { workspace = true }

# Not on iOS: wasmtime compiles plugins to machine code at run time, and iOS lets no app
# outside a debugger map memory executable, so plugins there are "not supported" as in the browser.
[target.'cfg(all(any(target_arch = "x86_64", target_arch = "aarch64"), not(target_os = "ios")))'.dependencies]
cap-std = "4"
log = { workspace = true }
wasmtime = { version = "48.0.8", default-features = false, features = ["call-hook", "component-model", "cranelift", "runtime", "cache", "parallel-compilation", "reexport-wasmparser", "std", "winch"] }

[target.'cfg(all(any(target_arch = "x86_64", target_arch = "aarch64"), not(target_os = "ios")))'.dev-dependencies]
wat = "1"
